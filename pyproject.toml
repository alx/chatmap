[project]
name = "chatmap"
version = "0.1.0"
description = "Turn a group chat export into a shareable interactive map"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexandre Girard-Davila" }]
keywords = ["maps", "chat", "signal", "geojson", "travel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chatmap = "chatmap.cli:main"

[project.urls]
Homepage = "https://github.com/alx/chatmap"
Source = "https://github.com/alx/chatmap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
